name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Version numbers
        run: |
          echo "BUILD=${{ github.run_number }}" >> $GITHUB_ENV
          echo "VERSION=0.5.${{ github.run_number }}" >> $GITHUB_ENV

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for iPhone (unsigned .ipa — SideStore / Sideloadly sign it)
        run: |
          set -o pipefail
          xcodebuild -project Premium.xcodeproj -scheme Premium -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build-device \
            MARKETING_VERSION=$VERSION CURRENT_PROJECT_VERSION=$BUILD \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee device.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || (grep -E "error:" device.log | head -60; exit 1)
          mkdir -p Payload && cp -R build-device/Build/Products/Release-iphoneos/Premium.app Payload/
          zip -qr Premium-unsigned.ipa Payload

      - name: Publish the download (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Premium ${{ env.VERSION }}
          body: |
            **Premium-unsigned.ipa** — install with SideStore (auto-updates) or Sideloadly.
            SideStore source: https://raw.githubusercontent.com/Ajayk909/Premium-iOS/main/sidestore-source.json
          make_latest: true
          files: Premium-unsigned.ipa

      - name: Update the SideStore source
        run: |
          SIZE=$(stat -f%z Premium-unsigned.ipa)
          git pull --rebase origin main
          python3 scripts/make_source.py "$VERSION" "$BUILD" "$SIZE"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add sidestore-source.json
          git commit -m "SideStore source: $VERSION [skip ci]" || exit 0
          git push origin HEAD:main
