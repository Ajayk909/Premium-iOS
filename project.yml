name: Premium
options:
  bundleIdPrefix: com.ajayk909
  deploymentTarget:
    iOS: "17.0"
packages:
  YouTubeKit:
    url: https://github.com/alexeichhorn/YouTubeKit
    branch: main
targets:
  Premium:
    type: application
    platform: iOS
    sources:
      - Premium
    dependencies:
      - package: YouTubeKit
    info:
      path: Premium/Info.plist
      properties:
        CFBundleDisplayName: Premium
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Premium looks for your Roku TV on your Wi-Fi so you can cast and use the remote.
        NSMicrophoneUsageDescription: Premium uses the microphone for voice search.
        NSSpeechRecognitionUsageDescription: Premium turns what you say into a search.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ajayk909.premium
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: NO
